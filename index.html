<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi biblioteca</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/style.css">
        <script src="js/script.js" defer></script>
    </head>

    <body>
        <header>
            <div>
                <h1>
                    <a href="index.html">Mi biblioteca 📖 · <span id="total-libros">0</span> libros</a>
                </h1>
                <p>Espacio personal de lectura</p>
            </div>

            <form>
                <input type="search" placeholder="Buscar un libro...">
                <button type="submit">🔍</button>
            </form>

            <div class="estadisticas">
                <button class="estadistica" 
                type="button"
                data-filtro-estado="leido"
                aria-pressed="false"
                >
                    <span aria-hidden="true">✓</span>
                    <span id="total-leidos">0</span>
                    <span>leídos</span>
                </button>

                <button class="estadistica" 
                type="button"
                data-filtro-estado="favorito"
                >
                    <span aria-hidden="true">♡</span>
                    <span id="total-favoritos">0</span>
                    <span>favoritos</span>
                </button>

                <button class="estadistica" 
                type="button"
                data-filtro-estado="pendiente"
                >
                    <span aria-hidden="true">⏳</span>
                    <span id="total-pendientes">0</span>
                    <span>pendientes</span>
                </button>
            </div>
            
        </header>

        <main>
            <section id="filtros">
                <h2>Filtrar libros</h2>

                <!-- Botones para filtrar los libros por género. -->
                <div>
                    <p>Género</p>

                    <button type="button"
                            data-filtro-genero="todos"
                            aria-pressed="true">Todos</button>

                    <button type="button"
                            data-filtro-genero="Fantasía"
                            aria-pressed="false">Fantasía</button>

                    <button type="button"
                            data-filtro-genero="Terror"
                            aria-pressed="false">Terror</button>

                    <button type="button"
                            data-filtro-genero="Thriller"
                            aria-pressed="false">Thriller</button>

                    <button type="button"
                            data-filtro-genero="Comedia"
                            aria-pressed="false">Comedia</button>
                    
                    <button type="button"
                            data-filtro-genero="Romance"
                            aria-pressed="false">Romance</button>

                    <button type="button"
                            data-filtro-genero="Novela histórica"
                            aria-pressed="false">Novela histórica</button>
                </div>
            </section>
            <section id="biblioteca">
                <h2>Mis libros</h2>
                
                <div class="catalogo-libros">
            
                </div>
            </section>
        </main>
        <footer>
            <p>© 2026 EvaCh · Biblioteca personal</p>
        </footer>
    </body>
</html>
